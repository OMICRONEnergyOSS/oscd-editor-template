<title>oscd-editor-template demo</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Roboto:wght@300;400;500&display=swap"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Material+Symbols+Outlined&display=block"
/>
<oscd-shell></oscd-shell>

<script type="module">
  import '@webcomponents/scoped-custom-element-registry';
  import 'https://omicronenergyoss.github.io/oscd-shell/oscd-shell.js';

  import OscdMenuOpen from '@omicronenergy/oscd-menu-open';
  import OscdMenuSave from '@omicronenergy/oscd-menu-save';
  import OscdBackgroundEditV1 from '@omicronenergy/oscd-background-editv1';
  import OscdEditorTemplate from '@omicronenergy/oscd-editor-template/oscd-editor-template.js';

  (async function () {
    const oscdShell = document.querySelector('oscd-shell');

    const params = new URL(document.location).searchParams;
    for (const [name, value] of params) {
      oscdShell.setAttribute(name, value);
    }

    const sample = await fetch('sample.scd').then(r => r.text());
    oscdShell.docs = {
      ['sample.scd']: new DOMParser().parseFromString(sample, 'application/xml'),
    };
    oscdShell.docName = 'sample.scd';

    oscdShell.registry.define('oscd-menu-open', OscdMenuOpen);
    oscdShell.registry.define('oscd-menu-save', OscdMenuSave);
    oscdShell.registry.define('oscd-background-editv1', OscdBackgroundEditV1);
    oscdShell.registry.define('oscd-editor-template', OscdEditorTemplate);

    oscdShell.plugins = {
      menu: [
        {
          name: 'Open File',
          translations: { de: 'Datei öffnen' },
          icon: 'folder_open',
          tagName: 'oscd-menu-open',
        },
        {
          name: 'Save File',
          translations: { de: 'Datei speichern' },
          icon: 'save',
          requireDoc: true,
          tagName: 'oscd-menu-save',
        },
      ],
      editor: [
        {
          name: 'Template Editor',
          translations: { de: 'Template Editor' },
          icon: 'edit',
          requireDoc: true,
          tagName: 'oscd-editor-template',
        },
        {
          name: 'Template Generator',
          translations: { de: 'Template Generator' },
          icon: 'add_box',
          requireDoc: true,
          src: 'https://omicronenergyoss.github.io/oscd-editor-template-generator/oscd-editor-template-generator.js',
        },
        // {
        //   name: 'Template Updater',
        //   translations: { de: 'Template Updater' },
        //   icon: 'copy_all',
        //   requireDoc: true,
        //   src: 'https://omicronenergyoss.github.io/oscd-template-updater/oscd-template-updater.js',
        // },
      ],
      background: [
        {
          name: 'EditV1 Events Listener',
          icon: 'none',
          requireDoc: true,
          tagName: 'oscd-background-editv1',
        },
        {
          name: 'Background Plugin for Wizard Events',
          src: 'https://omicronenergyoss.github.io/oscd-background-wizard-events/oscd-background-wizard-events.js',
          requireDoc: true,
          icon: 'none',
        },
      ],
    };
  })();
</script>

<style>
  * {
    --oscd-theme-text-font: 'Roboto';
    --oscd-theme-icon-font: 'Material Symbols Outlined';

    margin: 0px;
    padding: 0px;
  }

  abbr {
    text-decoration: none;
    border-bottom: none;
  }
</style>
